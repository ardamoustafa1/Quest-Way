<section class="qw-hero qw-hero-aligned qw-member-hero">
    <div class="qw-hero-bg" style="background-image: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?ixlib=rb-4.0.3&auto=format&fit=crop&w=2400&q=80');"></div>
    <div class="qw-hero-scrim"></div>
    <div class="qw-hero-grain"></div>
    <div class="qw-hero-content">
        <div class="qw-eyebrow qw-reveal">{{ hero_eyebrow }}</div>
        <h1 class="qw-hero-title qw-reveal">{{ hero_title }}<br><em>{{ hero_emphasis }}</em></h1>
        <p class="qw-hero-sub qw-reveal">{{ hero_description }}</p>
    </div>
    <a class="qw-scroll-cue" href="#page-content" aria-label="Scroll to page content">
        <span class="qw-scroll-text">Scroll</span>
        <span class="qw-scroll-line"></span>
    </a>
</section>
